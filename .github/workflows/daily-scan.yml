name: Daily ATS Scan

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to targets JSON config"
        required: false
        default: "presets/china-mnc-industrial.json"
      max_pages:
        description: "Max paginated requests per ATS provider"
        required: false
        default: "1"
  # Uncomment below after forking if you want an automated daily schedule (UTC):
  # schedule:
  #   - cron: "0 1 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run incremental ATS scan
        run: |
          PYTHONPATH=src python3 -m career_radar scan \
            --config "${{ inputs.config || 'presets/china-mnc-industrial.json' }}" \
            --db output/radar.db \
            --out output/scan \
            --max-pages "${{ inputs.max_pages || '1' }}"

      - name: Write scan summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          digest_path = Path("output/scan/scan_digest.json")
          if not digest_path.is_file():
              print("## Career Radar Scan\n\nNo `scan_digest.json` produced.")
          else:
              data = json.loads(digest_path.read_text(encoding="utf-8"))
              print("## Career Radar Scan Summary\n")
              print(f"- **Companies targeted**: {data.get('companies_targeted', 0)}")
              print(f"- **Matched new/updated jobs**: {len(data.get('matched_new_or_updated', []))}")
              print(f"- **Errors**: {len(data.get('errors', []))}\n")
              for item in data.get("matched_new_or_updated", []):
                  print(f"- **{item['company']}** | [{item['title']}]({item['url']}) ({item['location']})")
          PY

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-radar-scan
          path: output/scan/
          if-no-files-found: warn
